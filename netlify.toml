[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["data/neuroscope_psyche_dataset.csv"]

# IMPORTANT: redirect order matters — Netlify uses the first matching rule.
# This /api/* rule MUST come before the catch-all "/*" rule below, or every
# /api/... request just gets served index.html instead of hitting the function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker must never be served from a stale HTTP cache, or updates stall.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"
